<div class="logo">
  <img src="../../../../public/Logo.png" alt="Logo">
</div>

<div class="login-box">
  <h2>INICIO DE SESIÓN</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="input-box">
      <i class='bx bx-user'></i>
      <input type="text" id="correo" placeholder="juan@example.com" [(ngModel)]="credentials.correo" name="correo" required>
    </div>
    <div class="input-box">
      <i class='bx bx-car-key'></i>
      <input type="password" id="password" placeholder="********" [(ngModel)]="credentials.password" name="password" required>
    </div>
    <div class="btns">
      <button type="button" class="btn btn-primary" (click)="crearCuenta()">CREAR CUENTA</button>
      <button type="submit" class="btn btn-secondary">INGRESAR</button>
    </div>
    @if (error) {
        <div style="color: red;">{{ error }}</div>
    }
  </form>
</div>
